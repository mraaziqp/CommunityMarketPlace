# Local production-like stack: ShareHub + Postgres.
#   docker compose up --build   ->  http://localhost:8787
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sharehub
      POSTGRES_PASSWORD: sharehub
      POSTGRES_DB: sharehub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharehub"]
      interval: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sharehub:sharehub@db:5432/sharehub
      PUBLIC_APP_URL: http://localhost:8787
      DEMO_MODE: "true"
      PAYFAST_MODE: sandbox
volumes:
  pgdata:
