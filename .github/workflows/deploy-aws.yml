name: Deploy CommunityMarketPlace to AWS

# AWS Amplify Hosting is the primary deployment path and builds from
# amplify.yml on its own — see AWS_DEPLOYMENT_GUIDE.md. This workflow is the
# alternative S3 + CloudFront path, so it is manual-only: running it on every
# push would fail the moment the repository has no AWS secrets configured.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    # Skip rather than fail when the S3 path has not been set up.
    if: vars.DEPLOY_TARGET != 'amplify'

    steps:
      - name: Verify deployment secrets are present
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET_NAME }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=""
          [ -n "$BUCKET" ] || missing="$missing AWS_S3_BUCKET_NAME"
          [ -n "$KEY_ID" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "$DISTRIBUTION" ] || missing="$missing AWS_CLOUDFRONT_DISTRIBUTION_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "This workflow deploys to S3 + CloudFront. If you are hosting on" >&2
            echo "AWS Amplify instead, you do not need it - see AWS_DEPLOYMENT_GUIDE.md." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ShareHub is a static client-side app and reads no build-time
      # configuration, so no secrets are injected here. Anything passed to a
      # Vite build ends up readable in the shipped bundle.
      - name: Build production bundle
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync static files to AWS S3
        run: |
          # Hashed assets go up first and are kept forever, so a client holding
          # the old index.html can still fetch the chunks it references.
          aws s3 sync dist/assets/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/assets --cache-control "public, max-age=31536000, immutable"
          # Then the shell and public files, always revalidated. --delete is
          # scoped with --exclude so it cannot remove the assets synced above.
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete --exclude "assets/*" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
