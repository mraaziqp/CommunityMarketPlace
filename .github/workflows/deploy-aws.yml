name: Deploy CommunityMarketPlace to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ShareHub is a static client-side app and reads no build-time
      # configuration, so no secrets are injected here. Anything passed to a
      # Vite build ends up readable in the shipped bundle.
      - name: Build production bundle
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync static files to AWS S3
        run: |
          # Hashed assets go up first and are kept forever, so a client holding
          # the old index.html can still fetch the chunks it references.
          aws s3 sync dist/assets/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/assets --cache-control "public, max-age=31536000, immutable"
          # Then the shell and public files, always revalidated. --delete is
          # scoped with --exclude so it cannot remove the assets synced above.
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete --exclude "assets/*" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
